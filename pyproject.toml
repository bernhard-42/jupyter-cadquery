[build-system]
requires = ["hatchling", "hatch-jupyter-builder"]
build-backend = "hatchling.build"

[project]
name = "jupyter_cadquery"
version = "5.1.0"
description = "An extension to render cadquery objects in JupyterLab via pythreejs"
readme = "README.md"
authors = [{ name = "Bernhard Walter", email = "b_walter@arcor.de" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["ipython", "jupyter", "widgets", "CAD", "cadquery"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: IPython",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Graphics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Floor: the oldest that has been run. Cap: JupyterLab 5, where the
    # plugin and federation API changes - a minor has never broken this.
    "jupyterlab>=4.6.2, <5",
    "cad-viewer-widget>=4.1.1, <4.2",
    # No version: ocp-viewer-core owns the range through its own metadata
    "ocp-tessellate",
    "orjson",
    "ocp-viewer-core>=1.0.8, <1.1.0",
]

[project.optional-dependencies]
dev = [
    "jupyter-packaging",
    "cookiecutter",
    "twine",
    "bumpversion",
    "black",
    "pylint",
    "pyYaml",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
include = [
    "jupyter_cadquery/*.py",
    "jupyter-config/jupyter_server_config.d/jupyter_cadquery.json",
]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config/jupyter_server_config.d" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.envs.default.scripts]
jupyter-cadquery = "jupyter_cadquery.app:JupyterCadqueryBackend.launch_instance"


# = = = = = = = = = = = = = = 
# bump version
# = = = = = = = = = = = = = = 


[tool.bumpversion]
current_version = "5.1.0"
commit = false
tag = false
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?P<release>\\d*)(?P<build>\\d*)"
serialize = ["{major}.{minor}.{patch}"]
allow_dirty = true
message = "Bump version: {current_version} → {new_version}"
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
sign_tags = false
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []

[[tool.bumpversion.files]]
filename = "jupyter_cadquery/_version.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = 'Current version: **v{current_version}**'
replace = 'Current version: **v{new_version}**'

[[tool.bumpversion.files]]
filename = "README.md"
search = 'jupyter_cadquery {current_version} OK'
replace = 'jupyter_cadquery {new_version} OK'
